<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="برنامه تمرینی و تغذیه هایپرتروفی برای دانشجویان" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>هایپرتروفی | برنامه تمرینی دانشجویی</title>
  </head>
  <body class="bg-slate-950 text-slate-100 font-vazir antialiased">
    <div id="app" class="min-h-screen">
      <!-- boot splash, replaced by the app shell -->
      <div class="flex min-h-screen flex-col items-center justify-center gap-4 px-8 text-center">
        <div
          class="h-14 w-14 animate-spin rounded-full border-4 border-slate-800 border-t-emerald-400"
        ></div>
        <p class="text-sm text-slate-400">در حال بارگذاری برنامه…</p>
      </div>
    </div>

    <!-- Fixed layers: rendered once, never re-created by view re-renders -->
    <div id="overlay-root"></div>
    <div id="toast-root" class="pointer-events-none fixed inset-x-0 top-[calc(var(--safe-top)+0.5rem)] z-[80] flex flex-col items-center gap-2 px-4"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
