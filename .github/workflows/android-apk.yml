name: Android APK

# Builds a debug (debug-keystore signed, installable) Android APK of the Tauri v2
# app and publishes it as a downloadable workflow artifact.
#
# Notes
# - `src-tauri/gen/android` is git-ignored, so a fresh checkout generates it with
#   `tauri android init --ci`.
# - The Android toolchain (NDK paths) is resolved BEFORE `tauri android init`, so
#   the CLI and Gradle already see ANDROID_HOME / ANDROID_NDK_HOME / NDK_HOME.
# - The produced APK is signed with the Android debug key: great for sideloading,
#   not suitable for Play Store upload.

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "scripts/gen-icons.mjs"
      - "scripts/gen-android-icons.mjs"
      - "scripts/patch-android-manifest.mjs"
      - "scripts/inject-main-activity.mjs"
      - "src-tauri/icons/**"
      - "public/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/gen-icons.mjs"
      - "scripts/gen-android-icons.mjs"
      - "scripts/patch-android-manifest.mjs"
      - "scripts/inject-main-activity.mjs"
      - "src-tauri/icons/**"
      - "public/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which ABI(s) to build — armv7 is the smallest, all is ~4x bigger"
        type: choice
        default: armv7
        options:
          - armv7
          - aarch64
          - all

# One build per ref; a newer push cancels the previous run.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep Gradle from starting a daemon and give it enough heap for R8/AGP.
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

defaults:
  run:
    shell: bash

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Host libraries used by Tauri build scripts / pkg-config probes. Not
      # strictly needed to package an Android APK, but some crates' build.rs
      # look for GTK/WebKit when the host target is compiled.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ---------------------------------------------------------------------
      # Toolchains
      # ---------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android-apk

      # Installs cmdline-tools, accepts SDK licenses, sets ANDROID_HOME and puts
      # sdkmanager on PATH.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle (wrapper + dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ---------------------------------------------------------------------
      # Project
      # ---------------------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      # ---------------------------------------------------------------------
      # Toolchain paths — MUST run before `tauri android init`
      # ---------------------------------------------------------------------
      - name: Resolve Android toolchain (NDK / SDK platform)
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set — did the Android SDK step run?"
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"

          GRADLE_DIR="src-tauri/gen/android"

          # 1) NDK — use the version pinned by an existing generated project,
          #    otherwise the newest one on the runner, otherwise install a default.
          PINNED_NDK=""
          if [ -d "${GRADLE_DIR}" ]; then
            PINNED_NDK=$(grep -rhoE 'ndkVersion[[:space:]]*=[[:space:]]*"[0-9.]+"' "$GRADLE_DIR" \
              --include='*.gradle' --include='*.kts' 2>/dev/null \
              | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          fi

          NDK_DIR=""
          if [ -n "${PINNED_NDK}" ] && [ -d "${ANDROID_HOME}/ndk/${PINNED_NDK}" ]; then
            NDK_DIR="${ANDROID_HOME}/ndk/${PINNED_NDK}"
          elif [ -d "${ANDROID_HOME}/ndk" ]; then
            NEWEST_NDK=$(ls "${ANDROID_HOME}/ndk" | sort -V | tail -n 1 || true)
            if [ -n "${NEWEST_NDK}" ]; then
              NDK_DIR="${ANDROID_HOME}/ndk/${NEWEST_NDK}"
            fi
          fi

          if [ -z "${NDK_DIR}" ]; then
            echo "No NDK found on the runner — installing 27.0.12077973"
            # `yes | sdkmanager` trips pipefail when yes gets SIGPIPE; the
            # directory check below is the real verification.
            yes 2>/dev/null | sdkmanager --install "ndk;27.0.12077973" > /dev/null 2>&1 || true
            NDK_DIR="${ANDROID_HOME}/ndk/27.0.12077973"
          fi

          if [ ! -d "${NDK_DIR}" ]; then
            echo "::error::Android NDK not found at ${NDK_DIR}"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "Using NDK: ${NDK_DIR}"

          # 2) compileSdk platform — only when a generated project already exists
          #    (a fresh checkout gets its platform installed by `android init`).
          if [ -d "${GRADLE_DIR}" ]; then
            SDK_API=$(grep -rhoE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' "$GRADLE_DIR" \
              --include='*.gradle' --include='*.kts' 2>/dev/null \
              | head -n 1 | grep -oE '[0-9]+' || true)
            echo "compileSdk: ${SDK_API:-unknown}"
            if [ -n "${SDK_API}" ] && [ ! -d "${ANDROID_HOME}/platforms/android-${SDK_API}" ]; then
              yes 2>/dev/null | sdkmanager --install "platforms;android-${SDK_API}" > /dev/null 2>&1 || true
            fi
          fi

          echo "--- environment ---"
          java -version 2>&1 | head -n 2 || true
          rustc --version
          node --version

      # --ci skips prompts. --skip-targets-install is safe because the Rust step
      # above already installed the four Android targets.
      - name: Initialise Tauri Android project (if needed)
        run: |
          set -euo pipefail
          if [ -d src-tauri/gen/android ]; then
            echo "src-tauri/gen/android already exists — skipping init."
          else
            npx tauri android init --ci --skip-targets-install
          fi
          echo "--- generated project ---"
          ls -1 src-tauri/gen/android

      # `src-tauri/gen/android` is regenerated on every run, so the exact-alarm
      # permissions are injected after init instead of editing a git-ignored file.
      # The notification plugin only calls `setExactAndAllowWhileIdle` when
      # `canScheduleExactAlarms()` is true, so without these Android falls back to
      # an inexact alarm that Doze can delay by minutes.
      - name: Add exact-alarm permissions to the Android manifest
        run: |
          set -euo pipefail
          node scripts/patch-android-manifest.mjs
          grep -n "uses-permission" src-tauri/gen/android/app/src/main/AndroidManifest.xml

      # The notification plugin launches the activity for the water reminder's
      # action button, which drags the whole app to the foreground just to log a
      # glass. `MainActivity` is patched to read the action extra and send the
      # task back with `moveTaskToBack(true)`. Same reason as above: the file is
      # regenerated on every run, so it is injected instead of committed.
      - name: Inject background water action into MainActivity
        run: |
          set -euo pipefail
          node scripts/inject-main-activity.mjs
          grep -n "fitpro-background-water\|moveTaskToBack" \
            src-tauri/gen/android/app/src/main/java/ir/student/hypertrophy/MainActivity.kt

      # `tauri android init` scaffolds the project with Tauri's default launcher
      # icons. The committed Android set is built by `scripts/gen-android-icons.mjs`
      # instead of `tauri icon`: the CLI blows the artwork up to the full 108dp
      # adaptive canvas, which Android then crops to the 72dp mask, so the crest
      # looked zoomed in / cut off on real phones. The script also copies the
      # assets into the generated project, so it works on a fresh checkout.
      - name: Apply launcher icons to the Android project
        run: |
          set -euo pipefail
          node scripts/gen-android-icons.mjs
          echo "--- generated res ---"
          ls -1 src-tauri/gen/android/app/src/main/res | head -n 14
          echo "--- adaptive icon ---"
          cat src-tauri/gen/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------
      # `tauri android build` also runs `beforeBuildCommand` (vite build), so the
      # frontend is bundled automatically before Gradle packages the APK.
      - name: Build debug APK
        env:
          CI: "true"
          # Default is armeabi-v7a: one ABI keeps the APK small (the universal
          # build is ~4x bigger because each ABI ships its own .so).
          TARGET_INPUT: ${{ inputs.target || 'armv7' }}
          # Debug symbols are the bulk of the Rust .so (~120 MB each). They are
          # useless in a downloadable APK, so strip them for CI only — this does
          # not touch the local `[profile.dev]` used by `npm run tauri:dev`.
          CARGO_PROFILE_DEV_STRIP: debuginfo
        run: |
          set -euo pipefail
          ARGS=(--apk --debug)
          case "${TARGET_INPUT}" in
            all)
              echo "Building all four ABIs (universal APK, ~4x bigger)."
              ;;
            armv7)
              echo "Building armeabi-v7a only (runs on 32-bit and most 64-bit phones)."
              ARGS+=(--target armv7)
              ;;
            aarch64)
              echo "Building arm64-v8a only."
              ARGS+=(--target aarch64)
              ;;
            *)
              echo "Building ${TARGET_INPUT} only."
              ARGS+=(--target "${TARGET_INPUT}")
              ;;
          esac
          npx tauri android build "${ARGS[@]}"

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          while IFS= read -r apk; do
            echo "Found ${apk}"
            cp "${apk}" artifacts/
          done < <(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' 2>/dev/null)

          if [ -z "$(ls -A artifacts)" ]; then
            echo "::error::No APK was produced by the build."
            exit 1
          fi

          (cd artifacts && sha256sum ./*.apk | tee SHA256SUMS.txt)
          ls -lh artifacts

      # Proves the permissions survived manifest merging into the packaged APK.
      - name: Verify permissions inside the APK
        run: |
          set -euo pipefail
          AAPT2=$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "${AAPT2}" ]; then
            echo "::warning::aapt2 not found — skipping the packaged permission check"
            exit 0
          fi
          PERMS=$("${AAPT2}" dump permissions artifacts/*.apk)
          printf '%s\n' "${PERMS}"
          for perm in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM WAKE_LOCK; do
            if ! printf '%s' "${PERMS}" | grep -q "${perm}"; then
              echo "::error::${perm} is missing from the packaged APK"
              exit 1
            fi
          done
          echo "All required permissions are packaged in the APK."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: persian-hypertrophy-android-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # APKs are already compressed

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 📦 Android debug APK"
            echo ""
            if [ -d artifacts ] && [ -n "$(ls -A artifacts 2>/dev/null)" ]; then
              echo "| File | Size |"
              echo "| --- | --- |"
              for file in artifacts/*.apk; do
                [ -e "$file" ] || continue
                printf '| `%s` | %s |\n' "$(basename "$file")" "$(du -h "$file" | cut -f1)"
              done
              echo ""
              echo "Download it from the **Artifacts** section of this run, then install with:"
              echo ""
              echo '```bash'
              echo "adb install -r app-universal-debug.apk"
              echo '```'
              echo ""
              echo "_Debug-signed APK — installable, not suitable for Play Store upload._"
            else
              echo "⚠️ No APK was produced — check the build logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
