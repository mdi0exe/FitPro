[package]
name = "persian-hypertrophy"
version = "0.1.0"
description = "Persian Hypertrophy & Workout Tracker (Tauri v2, Android + Desktop)"
authors = ["Persian Hypertrophy"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix avoids a name clash with the binary on Windows, and
# `staticlib`/`cdylib` are required for the Tauri v2 Android target.
[lib]
name = "persian_hypertrophy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
